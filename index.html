const gradeColor = (g) => g === "Pass" ? { fg: C.green, bg: C.greenSoft } : g === "Fail" ? { fg: C.red, bg: C.redSoft } : { fg: C.amber, bg: C.amberSoft };
const severityColor = (s) => s === "Critical" ? { fg: C.red, bg: C.redSoft } : s === "Major" ? { fg: C.amber, bg: C.amberSoft } : { fg: C.inkSoft, bg: "#E7E4D9" };
const fmt = (d) => d ? new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—";

function Sparkline({ points, color }) {
  if (!points.length) return <p className="text-sm" style={{ color: C.inkSoft }}>Not enough data yet.</p>;
  const w = 240, h = 60, pad = 6;
  const step = points.length > 1 ? (w - 2 * pad) / (points.length - 1) : 0;
  const coords = points.map((p, i) => [pad + i * step, h - pad - (p / 100) * (h - 2 * pad)]);
  const path = coords.map((c, i) => (i === 0 ? "M" : "L") + c[0] + "," + c[1].toFixed(1)).join(" ");
  return (
    <svg viewBox={"0 0 " + w + " " + h} className="w-full h-16">
      <path d={path} fill="none" stroke={color} strokeWidth="2" />
      {coords.map((c, i) => <circle key={i} cx={c[0]} cy={c[1]} r="3" fill={color} />)}
    </svg>
  );
}

function SelfAuditFillForm({ onCancel, onSubmit }) {

    const r = {};

    return r;
  });
  const submit = () => {
    const items = [];

      items.push({ category: sec.category, item_text: item, passed: results[sec.category + "|" + i] });

    <div className="max-w-2xl">

function ClientPortal({ client, audits, selfAudits, resources, onToggleResolved, onSubmitSelfAudit }) {
  const { t, tv } = useLang();
  const [tab, setTab] = useState("dashboard");
  const [expanded, setExpanded] = useState(null);

  const sorted = useMemo(() => [...audits].sort((a, b) => (a.date < b.date ? 1 : -1)), [audits]);
  const latest = sorted[0];
  const openItems = useMemo(() => {
    const rank = { Critical: 0, Major: 1, Minor: 2 };
    return audits.flatMap(a => (a.findings || []).filter(f => !f.resolved).map(f => ({ ...f, auditDate: a.date })))
      .sort((a, b) => rank[a.severity] - rank[b.severity]);

        <h2 className="font-serif text-2xl mt-1" style={{ color: C.ink }}>{t("welcomeBack")} {client.name}</h2>
      </div>

      <div className="flex gap-2 flex-wrap no-print">
        {NAV.map(([key, label]) => (
          <button key={key} onClick={() => setTab(key)} className="text-sm font-medium px-4 py-2 rounded"
            style={tab === key ? { backgroundColor: C.teal, color: "#fff" } : { backgroundColor: C.panel, color: C.inkSoft, border: "1px solid " + C.line }}>{label}</button>
        ))}
      </div>

      {tab === "dashboard" && <ClientDashboard client={client} audits={audits} selfAudits={selfAudits} openItems={openItems} latest={latest} onToggleResolved={onToggleResolved} />}

      {tab === "audits" && (
        <div>
          <h3 className="font-serif text-lg mb-3" style={{ color: C.ink }}>{t("auditHistory")}</h3>
          <div className="space-y-2">
            {sorted.map(a => (
              <div key={a.id} className="rounded" style={{ backgroundColor: C.panel, border: "1px solid " + C.line }}>
                <button onClick={() => setExpanded(expanded === a.id ? null : a.id)} className="w-full flex items-center justify-between p-4 text-left">
                  <div>
                    <p className="text-sm font-medium" style={{ color: C.ink }}>{fmt(a.date)} · {tv(a.type)}</p>
                    <p className="text-xs" style={{ color: C.inkSoft }}>{t("score")} {a.score}</p>
                  </div>
                  <Badge label={tv(a.grade)} {...gradeColor(a.grade)} />

                {expanded === a.id && (

                    {(a.findings || []).length === 0
                      ? <p className="text-sm" style={{ color: C.inkSoft }}>{t("noFindings")}</p>
                      : a.findings.map(f => (
                        <div key={f.id} className="flex items-center gap-2 text-sm" style={{ color: C.ink }}>
                          <Badge label={tv(f.severity)} {...severityColor(f.severity)} /><span>{f.description}</span>{f.resolved && <span style={{ color: C.green }}>✓</span>}

      {tab === "selfaudits" && <ClientSelfAudits selfAudits={selfAudits} onSubmit={(p) => onSubmitSelfAudit(client.id, p)} onPrint={() => setTab("print")} />}
      {tab === "education" && <ClientEducation resources={resources} />}

// ---------------------------------------------------------------------------
// Signature pad — works with mouse, touch, and stylus via Pointer Events
// ---------------------------------------------------------------------------
function SignaturePad({ onChange }) {
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const hasDrawn = useRef(false);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ratio = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * ratio;
    canvas.height = canvas.clientHeight * ratio;
    const ctx = canvas.getContext("2d");
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1C2B4A";
  }, []);

  const pos = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  };
  const start = (e) => {
    e.preventDefault();
    drawing.current = true;
    const ctx = canvasRef.current.getContext("2d");
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };
  const move = (e) => {
    if (!drawing.current) return;
    e.preventDefault();
    const ctx = canvasRef.current.getContext("2d");
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    hasDrawn.current = true;
  };
  const end = () => {
    if (!drawing.current) return;
    drawing.current = false;
    if (hasDrawn.current) onChange(canvasRef.current.toDataURL("image/png"));
  };
  const clear = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawn.current = false;
    onChange(null);
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        className="w-full touch-none rounded"
        style={{ height: 140, backgroundColor: "#fff", border: "1.5px dashed " + C.line }}
        onPointerDown={start} onPointerMove={move} onPointerUp={end} onPointerLeave={end}
      />
      <button type="button" onClick={clear} className="text-xs mt-2 px-3 py-1 rounded" style={{ border: "1px solid " + C.line, color: C.inkSoft }}>Clear signature</button>
    </div>
  );
}

// ---------------------------------------------------------------------------
// AuditRunner — the full on-site, tablet-friendly structured audit flow
// ---------------------------------------------------------------------------
function AuditRunner({ client, templateKey, onCancel, onSubmit }) {
  const tpl = AUDIT_TEMPLATES[templateKey];
  const [screen, setScreen] = useState("header"); // header | sections | summary | sign
  const [header, setHeader] = useState(() => {
    const h = {};
    tpl.headerFields.forEach(f => { h[f.key] = ""; });
    h.business = client.name;
    h.address = "";
    h.auditDate = new Date().toISOString().slice(0, 10);
    return h;
  });
  const [responses, setResponses] = useState({});
  const [openSection, setOpenSection] = useState(0);
  const [summary, setSummary] = useState(() => {
    const s = {};
    tpl.summaryFields.forEach(f => { s[f.key] = f.type === "number" ? 0 : ""; });
    return s;
  });
  const [corrective, setCorrective] = useState([{ finding: "", action: "", responsible: "", due: "" }]);
  const [managerName, setManagerName] = useState("");
  const [managerSig, setManagerSig] = useState(null);
  const [auditorSig, setAuditorSig] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const setResponse = (sIdx, iIdx, patch) => {
    const key = sIdx + "-" + iIdx;
    setResponses(prev => ({ ...prev, [key]: { ...prev[key], ...patch } }));
  };
  const bulkSet = (sIdx, status) => {
    setResponses(prev => {
      const next = { ...prev };
      tpl.sections[sIdx].items.forEach((_, iIdx) => {
        const key = sIdx + "-" + iIdx;
        next[key] = { ...next[key], status };
      });
      return next;
    });
  };

  const totalItems = tpl.sections.reduce((n, s) => n + s.items.length, 0);
  const answeredCount = Object.values(responses).filter(r => r && r.status).length;
  const ncCount = Object.values(responses).filter(r => r && (r.status === "NC")).length;
  const positiveKey = tpl.statusOptions[0]; // "C" or "PASS"
  const positiveCount = Object.values(responses).filter(r => r && r.status === positiveKey).length;
  const naCount = Object.values(responses).filter(r => r && r.status === "NA").length;
  const scorable = totalItems - naCount;
  const scorePct = scorable > 0 ? Math.round((positiveCount / (scorable || 1)) * 100) : 100;

  const sectionStatus = (sIdx) => {
    const items = tpl.sections[sIdx].items;
    const answered = items.filter((_, i) => responses[sIdx + "-" + i]?.status).length;
    const hasNC = items.some((_, i) => responses[sIdx + "-" + i]?.status === "NC");
    return { answered, total: items.length, hasNC };
  };

  const addCorrectiveRow = () => setCorrective(prev => [...prev, { finding: "", action: "", responsible: "", due: "" }]);
  const updateCorrective = (i, field, val) => setCorrective(prev => prev.map((r, idx) => idx === i ? { ...r, [field]: val } : r));

  const submit = async () => {
    setSubmitting(true);
    const grade = tpl.gradeMap[summary.overallResult] || (ncCount > 0 ? "Conditional Pass" : "Pass");
    await onSubmit({
      template: templateKey,
      header,
      responses,
      summary,
      correctiveActions: corrective.filter(r => r.finding || r.action),
      managerName,
      managerSignature: managerSig,
      auditorSignature: auditorSig,
      score: scorePct,
      grade,
      ncItems: Object.entries(responses).filter(([, r]) => r && r.status === "NC").map(([key, r]) => {
        const [sIdx, iIdx] = key.split("-").map(Number);
        return { category: tpl.sections[sIdx].title, description: tpl.sections[sIdx].items[iIdx] + (r.notes ? " — " + r.notes : ""), due_date: summary.followUpDate || header.auditDate };
      }),
    });
    setSubmitting(false);
  };

  return (
    <div className="fixed inset-0 z-40 overflow-y-auto" style={{ backgroundColor: C.paper }}>
      <div className="max-w-3xl mx-auto px-4 sm:px-6 py-6 pb-24">
        <div className="flex items-center justify-between mb-6">
          <div>
            <p className="text-xs" style={{ color: C.inkSoft }}>{tpl.formTitle}</p>
            <h2 className="font-serif text-xl" style={{ color: C.ink }}>{client.name}</h2>
          </div>
          <button onClick={onCancel} className="text-sm px-3 py-2 rounded" style={{ border: "1px solid " + C.line, color: C.inkSoft }}>Cancel</button>
        </div>

        {screen === "header" && (
          <div className="space-y-4">
            <div className="rounded p-5" style={{ backgroundColor: C.panel, border: "1px solid " + C.line }}>
              <h3 className="font-serif text-lg mb-4" style={{ color: C.ink }}>Audit details</h3>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {tpl.headerFields.map(f => (
                  <div key={f.key}>
                    <FieldLabel>{f.label}</FieldLabel>
                    {f.type === "select" ? (
                      <select value={header[f.key]} onChange={e => setHeader(h => ({ ...h, [f.key]: e.target.value }))} className={inputCls} style={inputStyle}>
                        <option value="">—</option>
                        {f.options.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    ) : (
                      <input type={f.type === "date" ? "date" : "text"} value={header[f.key]} onChange={e => setHeader(h => ({ ...h, [f.key]: e.target.value }))} className={inputCls} style={inputStyle} />
                    )}
                  </div>
                ))}
              </div>
            </div>
            <button onClick={() => setScreen("sections")} className="w-full text-sm font-medium py-3 rounded text-white" style={{ backgroundColor: C.teal }}>Start checklist</button>
          </div>
        )}

        {screen === "sections" && (
          <div className="space-y-4">
            <div className="sticky top-0 z-10 py-2" style={{ backgroundColor: C.paper }}>
              <div className="flex items-center justify-between text-xs mb-1" style={{ color: C.inkSoft }}>
                <span>{answeredCount} / {totalItems} answered</span>
                {ncCount > 0 && <span style={{ color: C.red }}>{ncCount} non-compliant</span>}
              </div>
              <div className="h-2 rounded-full" style={{ backgroundColor: C.line }}>
                <div className="h-2 rounded-full" style={{ width: (answeredCount / totalItems * 100) + "%", backgroundColor: C.teal }} />
              </div>
            </div>

            {tpl.sections.map((section, sIdx) => {
              const st = sectionStatus(sIdx);
              const isOpen = openSection === sIdx;
              return (
                <div key={sIdx} className="rounded overflow-hidden" style={{ backgroundColor: C.panel, border: "1px solid " + C.line }}>
                  <button onClick={() => setOpenSection(isOpen ? -1 : sIdx)} className="w-full flex items-center justify-between p-4 text-left">
                    <div className="flex items-center gap-2">
                      {st.hasNC && <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: C.red }} />}
                      <h4 className="font-serif text-base" style={{ color: C.ink }}>{section.title}</h4>
                    </div>
                    <span className="text-xs shrink-0" style={{ color: st.answered === st.total ? C.green : C.inkSoft }}>{st.answered}/{st.total}</span>
                  </button>
                  {isOpen && (
                    <div className="px-4 pb-4">
                      <div className="flex gap-2 mb-3 flex-wrap">
                        {tpl.statusOptions.map(opt => (
                          <button key={opt} onClick={() => bulkSet(sIdx, opt)} className="text-xs px-2.5 py-1 rounded" style={{ border: "1px solid " + C.line, color: C.inkSoft }}>
                            Mark all {tpl.statusLabels[opt]}
                          </button>
                        ))}
                      </div>
                      <div className="space-y-3">
                        {section.items.map((item, iIdx) => {
                          const r = responses[sIdx + "-" + iIdx] || {};
                          return (
                            <div key={iIdx} className="rounded p-3" style={{ backgroundColor: "#fff", border: "1px solid " + C.line }}>
                              <p className="text-sm mb-2" style={{ color: C.ink }}>{item}</p>
                              <div className="flex gap-2 flex-wrap mb-2">
                                {tpl.statusOptions.map(opt => {
                                  const active = r.status === opt;
                                  const col = STATUS_COLOR[opt];
                                  return (
                                    <button key={opt} onClick={() => setResponse(sIdx, iIdx, { status: opt })}
                                      className="text-xs font-medium px-3 py-2 rounded"
                                      style={active ? { backgroundColor: col.fg, color: "#fff" } : { border: "1px solid " + C.line, color: C.inkSoft }}>
                                      {opt}
                                    </button>
                                  );
                                })}
                              </div>
                              {(r.status === "NC" || r.status === "OBS" || r.status === "VERIFY") && (
                                <input placeholder="Notes / corrective action" value={r.notes || ""} onChange={e => setResponse(sIdx, iIdx, { notes: e.target.value })}
                                  className="w-full text-xs rounded px-2 py-1.5" style={{ border: "1px solid " + C.line, color: C.ink }} />
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}

            <button onClick={() => setScreen("summary")} className="w-full text-sm font-medium py-3 rounded text-white sticky bottom-4" style={{ backgroundColor: C.teal }}>
              Continue to summary ({answeredCount}/{totalItems} answered)
            </button>
          </div>
        )}

        {screen === "summary" && (
          <div className="space-y-4">
            <div className="rounded p-5" style={{ backgroundColor: C.panel, border: "1px solid " + C.line }}>
              <h3 className="font-serif text-lg mb-1" style={{ color: C.ink }}>Audit summary</h3>
              <p className="text-sm mb-4" style={{ color: C.inkSoft }}>Score {scorePct}% · {ncCount} non-compliant item{ncCount === 1 ? "" : "s"} found</p>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {tpl.summaryFields.map(f => (
                  <div key={f.key} className={f.type === "textarea" ? "sm:col-span-2" : ""}>
                    <FieldLabel>{f.label}</FieldLabel>
                    {f.type === "select" ? (
                      <select value={summary[f.key]} onChange={e => setSummary(s => ({ ...s, [f.key]: e.target.value }))} className={inputCls} style={inputStyle}>
                        <option value="">—</option>
                        {f.options.map(o => <option key={o} value={o}>{o}</option>)}
                      </select>
                    ) : f.type === "textarea" ? (
                      <textarea rows={3} value={summary[f.key]} onChange={e => setSummary(s => ({ ...s, [f.key]: e.target.value }))} className={inputCls} style={inputStyle}></textarea>
                    ) : (
                      <input type={f.type === "date" ? "date" : f.type === "number" ? "number" : "text"} value={summary[f.key]} onChange={e => setSummary(s => ({ ...s, [f.key]: e.target.value }))} className={inputCls} style={inputStyle} />
                    )}
                  </div>
                ))}
              </div>
            </div>

            <div className="rounded p-5" style={{ backgroundColor: C.panel, border: "1px solid " + C.line }}>
              <h3 className="font-serif text-lg mb-3" style={{ color: C.ink }}>{tpl.correctiveLabel}</h3>
              <div className="space-y-2">
                {corrective.map((row, i) => (
                  <div key={i} className="grid grid-cols-1 sm:grid-cols-4 gap-2">
                    {tpl.correctiveCols.map((col, ci) => {
                      const field = ["finding", "action", "responsible", "due"][ci];
                      return <input key={ci} placeholder={col} value={row[field]} onChange={e => updateCorrective(i, field, e.target.value)} className="text-sm rounded px-2 py-1.5" style={inputStyle} />;
                    })}
                  </div>
                ))}
              </div>
              <button onClick={addCorrectiveRow} className="text-xs mt-3 px-3 py-1.5 rounded" style={{ border: "1px solid " + C.line, color: C.inkSoft }}>+ Add row</button>
            </div>

            <div className="flex gap-2">
              <button onClick={() => setScreen("sections")} className="text-sm font-medium px-4 py-3 rounded" style={{ border: "1px solid " + C.line, color: C.ink }}>← Back</button>
              <button onClick={() => setScreen("sign")} className="flex-1 text-sm font-medium py-3 rounded text-white" style={{ backgroundColor: C.teal }}>Continue to sign-off</button>
            </div>
          </div>
        )}

        {screen === "sign" && (
          <div className="space-y-4">
            <div className="rounded p-5" style={{ backgroundColor: C.panel, border: "1px solid " + C.line }}>
              <h3 className="font-serif text-lg mb-1" style={{ color: C.ink }}>Sign-off</h3>
              <p className="text-sm mb-4" style={{ color: C.inkSoft }}>Hand the tablet to the manager on duty to sign below.</p>

              <div className="mb-5">
                <FieldLabel>Manager / Person in Charge name</FieldLabel>
                <input value={managerName} onChange={e => setManagerName(e.target.value)} className={inputCls + " mb-3"} style={inputStyle} />
                <FieldLabel>Manager signature</FieldLabel>
                <SignaturePad onChange={setManagerSig} />
              </div>

              <div>
                <FieldLabel>Auditor signature (optional)</FieldLabel>
                <SignaturePad onChange={setAuditorSig} />
              </div>
            </div>

            <div className="flex gap-2">
              <button onClick={() => setScreen("summary")} className="text-sm font-medium px-4 py-3 rounded" style={{ border: "1px solid " + C.line, color: C.ink }}>← Back</button>
              <button disabled={!managerSig || !managerName || submitting} onClick={submit} className="flex-1 text-sm font-medium py-3 rounded text-white" style={{ backgroundColor: managerSig && managerName ? C.teal : C.line }}>
                {submitting ? "Saving…" : "Sign & save audit"}
              </button>
            </div>
            {(!managerSig || !managerName) && <p className="text-xs" style={{ color: C.inkSoft }}>Manager name and signature are required to save.</p>}
          </div>
        )}
      </div>
    </div>
  );
}

function AddAuditModal({ onClose, onSubmit }) {
  const { t, tv } = useLang();
  const [date, setDate] = useState(""); const [type, setType] = useState("Routine");
  const [score, setScore] = useState(""); const [grade, setGrade] = useState("Pass");
  const [findingsText, setFindingsText] = useState(""); const [severity, setSeverity] = useState("Minor"); const [dueDate, setDueDate] = useState("");
  const submit = () => {
    if (!date) return;
    const findings = findingsText.split("\n").map(s => s.trim()).filter(Boolean).map(desc => ({ category: "General", severity, description: desc, due_date: dueDate || date, resolved: false }));
    onSubmit({ date, type, score: Number(score) || 0, grade, findings });
  };
  return (
    <Modal title={t("uploadNewAuditTitle")} onClose={onClose} wide>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div><FieldLabel>{t("date")}</FieldLabel><input type="date" value={date} onChange={e => setDate(e.target.value)} className={inputCls} style={inputStyle} /></div>
        <div><FieldLabel>{t("type")}</FieldLabel><select value={type} onChange={e => setType(e.target.value)} className={inputCls} style={inputStyle}>
          {["Routine","Follow-up","Complaint response"].map(v => <option key={v} value={v}>{tv(v)}</option>)}
        </select></div>
        <div><FieldLabel>{t("score")}</FieldLabel><input type="number" value={score} onChange={e => setScore(e.target.value)} className={inputCls} style={inputStyle} /></div>
        <div><FieldLabel>Grade</FieldLabel><select value={grade} onChange={e => setGrade(e.target.value)} className={inputCls} style={inputStyle}>
          {["Pass","Conditional Pass","Fail"].map(v => <option key={v} value={v}>{tv(v)}</option>)}
        </select></div>
      </div>
      <FieldLabel>{t("findingsLabel")}</FieldLabel>
      <textarea value={findingsText} onChange={e => setFindingsText(e.target.value)} rows={4} className={inputCls + " mb-3"} style={inputStyle}></textarea>
      <div className="grid grid-cols-2 gap-3 mb-4">
        <div><FieldLabel>{t("findingsSeverity")}</FieldLabel><select value={severity} onChange={e => setSeverity(e.target.value)} className={inputCls} style={inputStyle}>
          {["Minor","Major","Critical"].map(v => <option key={v} value={v}>{tv(v)}</option>)}

        <div><FieldLabel>{t("findingsDueDate")}</FieldLabel><input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} className={inputCls} style={inputStyle} /></div>
      </div>

    </Modal>

function AppInner() {
  const [session, setSession] = useState(undefined); // undefined = loading, null = signed out
  const [profile, setProfile] = useState(null);
  const [previewClientId, setPreviewClientId] = useState(null);
  const [clients, setClients] = useState([]);
  const [audits, setAudits] = useState([]);
  const [documents, setDocuments] = useState([]);
  const [events, setEvents] = useState([]);
  const [resources, setResources] = useState([]);
  const [selfAudits, setSelfAudits] = useState([]);
  const { t } = useLang();

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); return; }
    sb.from("profiles").select("*").eq("id", session.user.id).single()
      .then(({ data }) => setProfile(data));
  }, [session]);

  const refreshAll = async () => {
    const [{ data: c }, { data: a }, { data: d }, { data: e }, { data: r }, { data: s }] = await Promise.all([
      sb.from("clients").select("*").order("name"),
      sb.from("audits").select("*, findings(*)").order("date", { ascending: false }),
      sb.from("documents").select("*").order("date", { ascending: false }),
      sb.from("calendar_events").select("*, clients(name)").order("date"),
      sb.from("resources").select("*").order("created_at", { ascending: false }),
      sb.from("self_audits").select("*, items:self_audit_items(*)").order("date", { ascending: false }),
    ]);
    setClients(c || []); setAudits(a || []); setDocuments(d || []); setEvents(e || []); setResources(r || []); setSelfAudits(s || []);
  };

  useEffect(() => { if (profile) refreshAll(); }, [profile]);

  if (session === undefined) return null;
  if (!session) return <Login />;
  if (!profile) return <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: C.paper, color: C.inkSoft }}>{t("loadingAccount")}</div>;

  const toggleResolved = async (findingId, resolved) => {
    await sb.from("findings").update({ resolved }).eq("id", findingId);
    refreshAll();
  };
  const addClient = async (payload) => { await sb.from("clients").insert(payload); refreshAll(); };
  const addAudit = async (clientId, payload) => {
    const { findings, ...auditFields } = payload;
    const { data: audit } = await sb.from("audits").insert({ ...auditFields, client_id: clientId }).select().single();
    if (audit && findings.length) await sb.from("findings").insert(findings.map(f => ({ ...f, audit_id: audit.id })));
    refreshAll();
  };
  const addDocument = async (clientId, payload) => { await sb.from("documents").insert({ ...payload, client_id: clientId }); refreshAll(); };
  const addEvent = async (payload) => { await sb.from("calendar_events").insert(payload); refreshAll(); };
  const addResource = async (payload) => { await sb.from("resources").insert(payload); refreshAll(); };
  const deleteResource = async (id) => { await sb.from("resources").delete().eq("id", id); refreshAll(); };
  const submitSelfAudit = async (clientId, payload) => {
    const { items, ...fields } = payload;
    const { data: sa } = await sb.from("self_audits").insert({ ...fields, client_id: clientId }).select().single();
    if (sa && items.length) await sb.from("self_audit_items").insert(items.map(i => ({ ...i, self_audit_id: sa.id })));
    refreshAll();
  };
  const submitAuditRecord = async (clientId, payload) => {
    // Create a matching summary row in `audits`/`findings` so the client dashboard,
    // audit history, and "things to do" list all pick this up automatically.
    const { data: audit } = await sb.from("audits").insert({
      client_id: clientId,
      date: payload.header.auditDate || new Date().toISOString().slice(0, 10),
      type: payload.template === "readiness" ? "Follow-up" : "Routine",
      score: payload.score,
      grade: payload.grade,
    }).select().single();
    if (audit && payload.ncItems.length) {
      await sb.from("findings").insert(payload.ncItems.map(f => ({ ...f, audit_id: audit.id, severity: "Major", resolved: false })));
    }
    await sb.from("audit_records").insert({
      client_id: clientId,
      template: payload.template,
      header: payload.header,
      responses: payload.responses,
      summary: payload.summary,
      corrective_actions: payload.correctiveActions,
      auditor_signature: payload.auditorSignature,
      manager_signature: payload.managerSignature,
      manager_name: payload.managerName,
      score: payload.score,
      grade: payload.grade,
      linked_audit_id: audit ? audit.id : null,
      signed_at: new Date().toISOString(),
    });
    refreshAll();
  };
  const createClientLogin = async (clientId, email, password, fullName) => {
    const token = session.access_token;
    const res = await fetch(EDGE_FN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ email, password, role: "client", client_id: clientId, full_name: fullName }),
    });
    return res.json();
  };

  const myClient = profile.role === "client" ? clients.find(c => c.id === profile.client_id) : null;
  const myAudits = profile.role === "client" ? audits.filter(a => a.client_id === profile.client_id) : [];
  const mySelfAudits = profile.role === "client" ? selfAudits.filter(sa => sa.client_id === profile.client_id) : [];

  const previewClient = previewClientId ? clients.find(c => c.id === previewClientId) : null;
  const previewAudits = previewClientId ? audits.filter(a => a.client_id === previewClientId) : [];
  const previewSelfAudits = previewClientId ? selfAudits.filter(sa => sa.client_id === previewClientId) : [];

  return (
    <div className="min-h-screen" style={{ backgroundColor: C.paper }}>
      <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6">
        <Header role={profile.role} fullName={profile.full_name} onLogout={() => sb.auth.signOut()} />
        {profile.role === "admin" && previewClient ? (
          <div>
            <div className="no-print flex items-center justify-between gap-3 mb-6 rounded p-3" style={{ backgroundColor: C.amberSoft, border: "1px solid " + C.amber }}>
              <p className="text-sm" style={{ color: C.ink }}>Previewing as <strong>{previewClient.name}</strong> — this is exactly what they see when they log in.</p>
              <button onClick={() => setPreviewClientId(null)} className="text-xs font-medium px-3 py-1.5 rounded text-white shrink-0" style={{ backgroundColor: C.ink }}>Exit preview</button>
            </div>
            <ClientPortal client={previewClient} audits={previewAudits} selfAudits={previewSelfAudits} resources={resources} onToggleResolved={toggleResolved} onSubmitSelfAudit={submitSelfAudit} />
          </div>
        ) : profile.role === "admin" ? (
          <AdminConsole
            clients={clients} audits={audits} documents={documents} events={events} resources={resources} selfAudits={selfAudits}
            onAddClient={addClient} onAddAudit={addAudit} onAddDocument={addDocument}
            onAddEvent={addEvent} onToggleResolved={toggleResolved} onCreateClientLogin={createClientLogin}
            onAddResource={addResource} onDeleteResource={deleteResource} onPreviewClient={setPreviewClientId}
            onSubmitAuditRecord={submitAuditRecord}
          />
        ) : (
          <ClientPortal client={myClient} audits={myAudits} selfAudits={mySelfAudits} resources={resources} onToggleResolved={toggleResolved} onSubmitSelfAudit={submitSelfAudit} />
        )}
      </div>
    </div>
  );
}

function App() {
  const [lang, setLang] = useState(localStorage.getItem("fc_lang") || "en");
  useEffect(() => { localStorage.setItem("fc_lang", lang); }, [lang]);
  const t = (key) => (UI[key] && UI[key][lang]) || (UI[key] && UI[key].en) || key;
  const tv = (str) => (lang === "es" && VALS[str]) ? VALS[str] : str;
  return (
    <LangContext.Provider value={{ lang, setLang, t, tv }}>
      <AppInner />
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
